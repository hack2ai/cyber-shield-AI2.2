name: Patch zero-value analytics segments

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch pie chart
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ThreatAnalyticsDashboard.tsx')
          text = p.read_text(encoding='utf-8')
          old = '                    data={getCategoryData()}\n                    cx="50%"'
          new = '                    data={getCategoryData().filter((entry) => entry.value > 0)}\n                    cx="50%"'
          if old in text:
              text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8')
              print('Patched zero-value pie segments.')
          else:
              print('Pie chart pattern not found; no change needed.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThreatAnalyticsDashboard.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: ignore zero-value pie segments"
          git push
