name: Cyber Shield AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Full dependency audit (non-blocking)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Security tests
        run: npm run test:security

      - name: Unit tests
        run: npm test

      - name: Firestore rules tests
        run: |
          npx firebase-tools emulators:exec \
            --only firestore \
            --project phish-intel-test \
            "npm run test:rules"

      - name: Production build
        run: npm run build
