name: Harden analytics charts

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch chart containers
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/components/ThreatAnalyticsDashboard.tsx')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
              '<ResponsiveContainer width="100%" height="100%">',
              '<ResponsiveContainer width="100%" height="100%" minWidth={0} minHeight={240}>',
          )
          text = text.replace(
              '<ResponsiveContainer width="100%" height="100%" minWidth={0} minHeight={240}>\n              <RadarChart cx="50%" cy="50%" outerRadius="75%"',
              '<ResponsiveContainer width="100%" height="100%" minWidth={0} minHeight={240}>\n              <RadarChart cx="50%" cy="50%" outerRadius={80}',
          )

          if text == original:
              print('No chart patch changes needed.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          print('Chart containers patched.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ThreatAnalyticsDashboard.tsx
          if git diff --cached --quiet; then
            echo "No patch commit required."
            exit 0
          fi
          git commit -m "fix: stabilize analytics chart dimensions"
          git push
