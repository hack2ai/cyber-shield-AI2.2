name: Cyber Shield AI Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Firestore rules tests
        run: |
          npx firebase-tools emulators:exec \
            --only firestore \
            --project phish-intel-test \
            "npm run test:rules"

      - name: Production build
        run: npm run build
