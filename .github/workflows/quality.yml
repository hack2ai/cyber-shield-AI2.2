name: Cyber Shield AI Quality

# Quality gates were consolidated into ci.yml.
# Keep this workflow manual-only so historical runs remain visible
# without creating a second automatic CI pipeline.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consolidated:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Quality pipeline consolidated
        run: echo "Quality checks are consolidated into .github/workflows/ci.yml"
