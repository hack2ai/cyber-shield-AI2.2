name: Route local sessions to local storage

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch local session detection
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/App.tsx')
          text = path.read_text(encoding='utf-8')

          desired = """function isMockSessionUser(user: { uid: string } | null | undefined) {
            const isLocalBrowser = typeof window !== 'undefined' &&
              (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');

            return isLocalBrowser || (!!user && (
              user.uid === 'mock-analyst-1337' ||
              user.uid.startsWith('mock-user-')
            ));
          }"""

          pattern = re.compile(
              r"function isMockSessionUser\(user: \{ uid: string \} \| null \| undefined\) \{.*?\n\}",
              re.DOTALL,
          )

          match = pattern.search(text)
          if not match:
              raise SystemExit('isMockSessionUser block was not found.')

          current = match.group(0)
          if 'window.location.hostname' in current and "user.uid === 'mock-analyst-1337'" in current:
              print('Local session detection is already patched; nothing to change.')
          else:
              path.write_text(text[:match.start()] + desired + text[match.end():], encoding='utf-8')
              print('Patched local session detection.')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "fix: use local storage for localhost app sessions"
          git push
